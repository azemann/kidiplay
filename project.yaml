schema_version: 3

project:
  name: "KidiPlay"
  kind: "application Android ludique et créative pour enfants"
  version: "0.0.0-exploration"

components:
  main:
    root: "."
    languages:
      primary: "Kotlin"
      secondary: []
    toolchain:
      compiler_or_interpreter: "Kotlin compiler 2.3.21 via the Gradle plugin"
      runtimes:
        - "Android 6.0 (API 23) or newer"
      dependency_managers:
        - "Gradle 8.14.5"
      build_tools:
        - "Gradle Wrapper 8.14.5"
        - "Android Gradle Plugin 8.13.2"
      frameworks:
        - "Jetpack Compose (BOM 2026.06.00)"
        - "AndroidX Activity Compose 1.13.0"
    targets:
      - "Android phone"
      - "Android tablet"
      - "Android foldable"
    commands:
      install:
        status: unresolved
        argv: []
        reason: "La commande doit être confirmée depuis le projet réel."
      test:
        status: defined
        argv: ["./gradlew", "testDebugUnitTest"]
      build:
        status: defined
        argv: ["./gradlew", "assembleDebug"]
    artifacts: []

# Les portées sont indépendantes. Une cible future peut être ajoutée sous
# distribution.intent sans activer de pipeline, secret ou environnement.
delivery:
  scopes:
    development:
      status: active
      execution: manual
      pipelines: []
    release:
      status: deferred
      reason: "À activer lorsqu'un artefact versionné doit être produit et qualifié."
    distribution:
      status: deferred
      reason: "À activer lorsqu'un canal, un store, un registre ou un environnement réel est choisi."
    operation:
      status: deferred
      reason: "À activer lorsqu'un système installé ou en service doit être maintenu."

artifacts: {}
pipelines: {}
environments: {}
secrets: {}

evidence:
  declared_by: "human"
  last_verified: "2026-07-28"
